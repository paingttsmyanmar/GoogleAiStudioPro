<!DOCTYPE html>
<html>

<head>

<title>Gemini TTS Tool</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>🤖 Gemini Text To Speech</h1>


<p>Google AI Studio API Key</p>

<input 
id="apiKey"
type="password"
placeholder="Paste Gemini API Key">


<textarea 
id="text"
placeholder="Enter text here...">
</textarea>


<button onclick="speakText()">
🔊 Speak
</button>


<button onclick="stopSpeak()">
⛔ Stop
</button>


<button onclick="generateAI()">
✨ Gemini Improve Text
</button>


</div>


<script src="script.js"></script>


</body>

</html>
