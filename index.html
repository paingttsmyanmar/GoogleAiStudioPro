<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <!-- ဖုန်းစခရင် ကွက်တိဖြစ်စေရန် အရေးကြီးသော Viewport Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Voice Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <h1><i class="fa-solid fa-microphone-lines"></i> Gemini Voice Studio</h1>
        </header>

        <!-- API Key Input -->
        <div class="card">
            <label for="apiKey"><i class="fa-solid fa-key"></i> Gemini API Key</label>
            <div class="input-group">
                <input type="password" id="apiKey" placeholder="Paste API Key here...">
                <button id="toggleApiKey" type="button"><i class="fa-solid fa-eye"></i></button>
            </div>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="api-link">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Get API Key from Google AI Studio
            </a>
        </div>

        <!-- Text Input -->
        <div class="card">
            <label for="textInput"><i class="fa-solid fa-pen-to-square"></i> Enter Text</label>
            <textarea id="textInput" rows="3" placeholder="Write your text here..."></textarea>
        </div>

        <!-- Voice & Emotion Options -->
        <div class="card grid-2">
            <div>
                <label for="voiceSelect"><i class="fa-solid fa-user-gear"></i> Voice Character</label>
                <select id="voiceSelect">
                    <optgroup label="👨 အမျိုးသား ဇာတ်ကောင်များ">
                        <option value="Puck">Puck (Energetic Male / တက်ကြွသော)</option>
                        <option value="Charon">Charon (Deep Male / အသံဩဇာရှိသော)</option>
                    </optgroup>
                    <optgroup label="👩 အမျိုးသမီး ဇာတ်ကောင်များ">
                        <option value="Kore">Kore (Calm Female / တည်ငြိမ်သော)</option>
                        <option value="Fenrir">Fenrir (Expressive Female / စကားပြောပီသသော)</option>
                        <option value="Aoede">Aoede (Soft Female / ငြိမ့်ညောင်းသော)</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label for="emotionSelect"><i class="fa-solid fa-face-smile"></i> Emotion Tone</label>
                <select id="emotionSelect">
                    <option value="Normal">Normal (ပုံမှန်)</option>
                    <option value="Happy & Cheerful">Happy (ပျော်ရွှင်သော)</option>
                    <option value="Sad & Gentle">Sad (ဝမ်းနည်းသော)</option>
                    <option value="Excited & Enthusiastic">Excited (စိတ်လှုပ်ရှားသော)</option>
                    <option value="Whispering">Whispering (တိုးတိုးပြောသော)</option>
                </select>
            </div>
        </div>

        <!-- Generate Button -->
        <button id="generateBtn" class="btn-primary">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Voice
        </button>

        <!-- Preview & Audio Player -->
        <div class="card result-card" id="resultSection" style="display: none;">
            <label><i class="fa-solid fa-headphones"></i> Preview Audio</label>
            <audio id="audioPlayer" controls></audio>
        </div>

        <!-- Telegram Link -->
        <div class="card telegram-card">
            <i class="fa-brands fa-telegram telegram-icon"></i>
            <div class="telegram-info">
                <span>သူငယ်ချင်းများ စကားပြောရန် Group</span>
                <a href="https://t.me/NGAPAINGGYI" target="_blank">@NGAPAINGGYI</a>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Power Director by <span>Paing Hein Kyaw</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
    </html>
