<!DOCTYPE html>
<html>
<head>
<title>Gemini Voice Studio</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎙️ Gemini Voice Studio</h1>

<label>🔑 Gemini API Key</label>
<input id="apiKey" placeholder="Paste API Key">


<label>📝 Enter Text</label>
<textarea id="text" placeholder="Write your text here..."></textarea>


<div class="row">

<div>
<label>🎭 Voice</label>
<select id="voice">
<option>Male</option>
<option>Female</option>
</select>
</div>


<div>
<label>😊 Emotion</label>
<select id="emotion">
<option>Normal</option>
<option>Dramatic</option>
<option>Happy</option>
<option>Sad</option>
<option>Angry</option>
</select>
</div>

</div>


<label>⚡ Speed</label>
<input type="range" id="speed" min="0.5" max="2" value="1" step="0.1">


<label>🎵 Pitch</label>
<input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1">


<button onclick="generateVoice()">
✨ Generate Voice
</button>


<h2>🎧 Preview</h2>

<audio id="player" controls></audio>


<br>

<button onclick="downloadAudio()">
⬇ Download MP3
</button>


</div>


<script src="script.js"></script>

</body>
</html>
